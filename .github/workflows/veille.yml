name: Veille Energy Sentinel CI

# Programme le collecteur Python et republie automatiquement
# data/items.json + data/sources.json (lus par index.html) ainsi que
# la base SQLite persistée dans collector/state/.
#
# Déclenchement :
# - toutes les 30 minutes (ajustez le cron ci-dessous selon vos besoins)
# - manuellement depuis l'onglet "Actions" du dépôt (bouton "Run workflow")

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veille-energy-sentinel-ci
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: collector/requirements.txt

      - name: Installer les dépendances
        run: pip install -r collector/requirements.txt

      - name: Lancer un cycle de collecte + export JSON
        env:
          # État persisté (base SQLite) et export lus par index.html,
          # tous les deux dans le dépôt pour survivre d'un run à l'autre.
          ENERGY_SENTINEL_DATA_DIR: ${{ github.workspace }}/collector/state
          ENERGY_SENTINEL_EXPORT_DIR: ${{ github.workspace }}/data
          # Notifications Telegram optionnelles — laissez vide/absent si
          # vous ne les utilisez pas, le script reste silencieux.
          ENERGY_SENTINEL_TELEGRAM_TOKEN: ${{ secrets.ENERGY_SENTINEL_TELEGRAM_TOKEN }}
          ENERGY_SENTINEL_TELEGRAM_CHAT_ID: ${{ secrets.ENERGY_SENTINEL_TELEGRAM_CHAT_ID }}
        run: python collector/veille_rpetrole.py --once

      - name: Publier les nouvelles données si besoin
        run: |
          git config user.name "energy-sentinel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/items.json data/sources.json collector/state
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
          else
            git commit -m "Mise à jour automatique de la veille ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
